name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          # Project sites live at https://<user>.github.io/<repo>/.
          # For a user site (<user>.github.io) or a custom domain, set PAGES_BASE: /
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Prepare Pages artifact
        run: |
          rm -rf ./_site
          cp -r .output/public ./_site
          # Client-side routing fallback + skip Jekyll processing.
          cp ./_site/index.html ./_site/404.html
          touch ./_site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
